<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Inksy</title>
    <script>
      // Favicon is generated on the fly (a canvas drawing a pencil emoji),
      // rather than shipped as a static image asset.
      ;(function () {
        var canvas = document.createElement('canvas')
        canvas.width = 64
        canvas.height = 64
        var ctx = canvas.getContext('2d')
        ctx.font = '52px serif'
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'
        ctx.fillText('✏️', 32, 36)

        var link = document.createElement('link')
        link.rel = 'icon'
        link.type = 'image/png'
        link.href = canvas.toDataURL('image/png')
        document.head.appendChild(link)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://sitemind-api.onrender.com/widget.js" data-widget-key="wk_O5ELzLHk8NoUZ3QqfH_kP8Oj" async></script>
  </body>
</html>
